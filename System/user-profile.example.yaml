# ===================
# Amp User Profile
# ===================
# Generated by install.sh during onboarding.
# Values are set through the interactive setup conversation.

# Demo Mode
demo_mode: false

# Identity (name, role, and email domain are set during onboarding)
name: ""
role: ""
role_group: ""  # product, sales, marketing, finance, engineering, customer_success, operations, leadership, design, support, advisory
company: ""
company_size: ""  # startup, scaling, enterprise, large_enterprise
email_domain: ""
work_email: ""

# Connected Workspaces (optional)
connected_workspaces: []

# Calendar Configuration
calendar:
  work_calendar: ""
  calendar_count: 1
  permissions_pending: false
  lazy_load: true

# Obsidian Mode (optional, can be set later)
obsidian_mode: false

# Communication Preferences (formality and directness are set during onboarding, the rest can be edited later)
communication:
  formality: "professional_casual"  # formal, professional_casual, casual
  directness: "balanced"  # very_direct, balanced, supportive
  detail_level: "concise"  # concise, balanced, comprehensive
  career_level: "mid"  # junior, mid, senior, leadership, c_suite
  coaching_style: "collaborative"  # encouraging, collaborative, challenging

# Workflow Preferences
workflow:
  open_in_obsidian_on_create: false
  preferred_editor: ""  # obsidian, vscode, cursor, none
  work_week_start: "monday"
  work_week_end: "friday"
  task_source_of_truth: "03-Tasks/Tasks.md"
  external_task_sync: false

# Writing Style
writing_style:
  no_em_dashes: false

# Meeting Processing
meeting_processing:
  mode: "manual"  # manual, automatic
  api_provider: ""  # gemini, anthropic, openai

# Meeting Intelligence
meeting_intelligence:
  extract_customer_intel: false
  extract_competitive_intel: false
  extract_action_items: true
  extract_decisions: true
  extract_stakeholder_dynamics: false
  extract_budget_timeline: false
  extract_technical_decisions: false

# Journaling (optional)
journaling:
  morning: false
  evening: false
  weekly: false

# Quarterly Planning
quarterly_planning:
  enabled: false
  prompted: false
  q1_start_month: 1
  current_quarter: ""
  quarter_start_date: ""
  quarter_end_date: ""

# Analytics (anonymous, opt-in)
analytics:
  enabled: false
