manifest_version: 1
workflow: daily-plan
display_name: Daily Plan
workflow_hook: daily_plan
required_sources:
  - id: tasks
    name: Task ledger
    kind: file
    path: 03-Tasks/Tasks.md
    freshness_days: 7
  - id: weekly-priorities
    name: Weekly priorities
    kind: file
    path: 02-Week_Priorities/Week_Priorities.md
    freshness_days: 7
optional_sources:
  - id: calendar-email
    name: Calendar and email context
    kind: integration
    integration: google-workspace
    hook_key: use_google
  - id: slack-commitments
    name: Slack commitments
    kind: integration
    integration: slack
    hook_key: use_slack
  - id: people-index
    name: People index
    kind: file
    path: System/People_Index.json
    freshness_days: 7
    optional: true
health_sources:
  - id: session-learning-health
    name: Session learning capture health
    kind: session_learning_health
    path: System/Session_Learnings/_health.log
    legacy_scan: true
    window_days: 7
report:
  summarize_when_healthy: true
  include_sections:
    - Context used
    - Context skipped
    - Context stale
    - Health warnings
