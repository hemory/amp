manifest_version: 1
workflow: project-health
display_name: Project Health
workflow_hook: project_health
required_sources:
  - id: project-docs
    name: Project docs
    kind: directory
    path: 04-Projects
    recursive: true
    freshness_days: 14
  - id: tasks
    name: Task ledger
    kind: file
    path: 03-Tasks/Tasks.md
    freshness_days: 14
optional_sources:
  - id: weekly-priorities
    name: Weekly priorities
    kind: file
    path: 02-Week_Priorities/Week_Priorities.md
    freshness_days: 14
  - id: meeting-notes
    name: Meeting notes
    kind: directory
    path: 00-Inbox/Meetings
    recursive: true
    freshness_days: 30
    optional: true
health_sources:
  - id: session-learning-health
    name: Session learning capture health
    kind: session_learning_health
    path: System/Session_Learnings/_health.log
    legacy_scan: true
    window_days: 7
report:
  summarize_when_healthy: true
  include_sections:
    - Context used
    - Context skipped
    - Context stale
    - Health warnings
